services:
  api:
    build: .
    container_name: stock-lan-back-end
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://stock:stock@postgres:5432/stock_lan?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-to-a-32-character-minimum-secret
      JWT_REFRESH_SECRET: change-this-to-a-different-32-character-secret
      CORS_ORIGINS: http://localhost:5173
      DOCS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - proxy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock_lan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_lan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  proxy:
    external: true
