services:
  api:
    build: ./backend
    container_name: stock-lan-back-end
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      stock-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - proxy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: stock-lan-front-end
    restart: unless-stopped
    networks:
      - proxy

  stock-postgres:
    image: postgres:16-alpine
    container_name: stock-lan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock_lan
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_lan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4-alpine
    container_name: stock-lan-redis
    restart: unless-stopped
    volumes:
      - stock_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stock_postgres_data:
  stock_redis_data:

networks:
  proxy:
    external: true